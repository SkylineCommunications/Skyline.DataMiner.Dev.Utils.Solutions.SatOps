name: DataMiner CICD NuGet Solution

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-**"
      - "[0-9]+.[0-9]+.[0-9]+-**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  packages: write
  pull-requests: write

jobs:
  CICD:
    uses: SkylineCommunications/_ReusableWorkflows/.github/workflows/Master Workflow.yml@main
    with:
      solution-filter-name: "SatOps.slnx"
      sonarcloud-project-name: ${{ vars.SONAR_CLOUD_PROJECT_NAME }}
      nuget-push-source: "https://api.nuget.org/v3/index.json"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGETAPIKEY_GITHUB }}

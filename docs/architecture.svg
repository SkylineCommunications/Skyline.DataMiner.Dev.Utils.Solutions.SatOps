<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">SatOps DevPack &#8211; Architecture Overview</text>

  <!-- ================= SECTION 1: Package / consumer layout ================= -->
  <text x="40" y="70" font-size="16" font-weight="700" fill="#2b6cb0">1. Package layout</text>

  <!-- Consumer -->
  <rect x="470" y="85" width="260" height="50" rx="8" fill="#2d3748"/>
  <text x="600" y="116" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Your DataMiner script / app</text>

  <!-- Automation -->
  <rect x="60" y="175" width="300" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1a365d">SDM.SatOps.Automation</text>
  <text x="210" y="220" text-anchor="middle" font-size="11" fill="#2c5282">Automation script DevPack</text>

  <!-- GQI -->
  <rect x="450" y="175" width="300" height="60" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="600" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1a365d">SDM.SatOps.GQI</text>
  <text x="600" y="220" text-anchor="middle" font-size="11" fill="#2c5282">GQI data source DevPack</text>

  <!-- Placeholder / future -->
  <rect x="840" y="175" width="300" height="60" rx="8" fill="#f7fafc" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="990" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#4a5568">Other consumers</text>
  <text x="990" y="220" text-anchor="middle" font-size="11" fill="#718096">(future DevPacks)</text>

  <!-- Common lib -->
  <rect x="380" y="280" width="440" height="65" rx="8" fill="#2b6cb0"/>
  <text x="600" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Skyline.DataMiner.Dev.Utils.Solutions.SatOps</text>
  <text x="600" y="328" text-anchor="middle" font-size="11" fill="#ebf8ff">(SDM.SatOps.Common) &#8211; core API library, entry point: SatOpsApi</text>

  <!-- Tests -->
  <rect x="900" y="280" width="240" height="65" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/>
  <text x="1020" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#7b341e">SDM.SatOps.CommonTests</text>
  <text x="1020" y="323" text-anchor="middle" font-size="10" fill="#9c4221">MSTest unit tests</text>

  <!-- arrows -->
  <line x1="600" y1="135" x2="600" y2="172" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="135" x2="210" y2="172" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="235" x2="500" y2="278" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="235" x2="600" y2="278" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="1020" y1="280" x2="820" y2="313" stroke="#dd6b20" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= SECTION 2: Internal request pipeline ================= -->
  <text x="40" y="400" font-size="16" font-weight="700" fill="#2b6cb0">2. Request pipeline (per entity, e.g. Beam)</text>

  <rect x="60" y="420" width="200" height="55" rx="8" fill="#2d3748"/>
  <text x="160" y="452" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">ISatOpsApi.Beams</text>

  <rect x="310" y="420" width="220" height="55" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="420" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">BeamRepositoryMiddleware</text>
  <text x="420" y="461" text-anchor="middle" font-size="10" fill="#2c5282">decorator (cross-cutting)</text>

  <rect x="580" y="420" width="220" height="55" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="690" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">BeamValidationMiddleware</text>
  <text x="690" y="461" text-anchor="middle" font-size="10" fill="#2c5282">business rule checks</text>

  <rect x="850" y="420" width="200" height="55" rx="8" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="950" y="443" text-anchor="middle" font-size="12" font-weight="700" fill="#1a365d">BeamRepository</text>
  <text x="950" y="461" text-anchor="middle" font-size="10" fill="#2c5282">DOM read / write</text>

  <line x1="260" y1="447" x2="305" y2="447" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="447" x2="575" y2="447" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="447" x2="845" y2="447" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="880" y="510" width="240" height="55" rx="8" fill="#2b6cb0"/>
  <text x="1000" y="535" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">DomHelper</text>
  <text x="1000" y="553" text-anchor="middle" font-size="10" fill="#ebf8ff">DataMiner SDM / DOM instances</text>
  <line x1="950" y1="475" x2="980" y2="507" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="60" y="500" font-size="11" fill="#718096">Each repository (Satellite, Beam,</text>
  <text x="60" y="516" font-size="11" fill="#718096">Transponder, TransponderPlan,</text>
  <text x="60" y="532" font-size="11" fill="#718096">TransponderPlanRow, TransponderSlot)</text>
  <text x="60" y="548" font-size="11" fill="#718096">follows this same layered pattern,</text>
  <text x="60" y="564" font-size="11" fill="#718096">lazily created by SatOpsApi.</text>

  <!-- ================= SECTION 3: Domain model ================= -->
  <text x="40" y="620" font-size="16" font-weight="700" fill="#2b6cb0">3. Domain / entity relationships</text>

  <rect x="500" y="640" width="200" height="55" rx="8" fill="#276749"/>
  <text x="600" y="672" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Satellite</text>

  <rect x="300" y="730" width="180" height="50" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.5"/>
  <text x="390" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">Beam</text>

  <rect x="700" y="730" width="200" height="50" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.5"/>
  <text x="800" y="760" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">Transponder</text>

  <rect x="700" y="810" width="200" height="50" rx="8" fill="#c6f6d5" stroke="#276749" stroke-width="1.5"/>
  <text x="800" y="840" text-anchor="middle" font-size="12" font-weight="700" fill="#22543d">TransponderPlan</text>

  <rect x="950" y="800" width="220" height="45" rx="8" fill="#e6fffa" stroke="#276749" stroke-width="1.5"/>
  <text x="1060" y="827" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">TransponderPlanRow</text>

  <rect x="950" y="855" width="220" height="45" rx="8" fill="#e6fffa" stroke="#276749" stroke-width="1.5"/>
  <text x="1060" y="882" text-anchor="middle" font-size="11" font-weight="700" fill="#234e52">TransponderSlot</text>

  <line x1="550" y1="695" x2="410" y2="728" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="650" y1="695" x2="780" y2="728" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="695" x2="410" y2="748" stroke="#2f855a" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="800" y1="780" x2="800" y2="808" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="825" x2="945" y2="822" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="845" x2="945" y2="870" stroke="#2f855a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="600" y="702" font-size="9" fill="#4a5568">1</text>
  <text x="380" y="720" font-size="9" fill="#4a5568">*</text>
  <text x="782" y="720" font-size="9" fill="#4a5568">*</text>
  <text x="800" y="800" font-size="9" fill="#4a5568">*</text>
  <text x="940" y="815" font-size="9" fill="#4a5568">*</text>
  <text x="940" y="862" font-size="9" fill="#4a5568">*</text>

  <text x="40" y="655" font-size="10.5" fill="#718096">Beam &#8594; optional link on Transponder;</text>
  <text x="40" y="670" font-size="10.5" fill="#718096">validation middleware enforces that</text>
  <text x="40" y="685" font-size="10.5" fill="#718096">parent references exist before</text>
  <text x="40" y="700" font-size="10.5" fill="#718096">create / update.</text>
</svg>
